
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VallePlay</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">

        <nav class="header__nav" aria-label="Navegación principal">

            <a href="#inicio" class="header__logo">

                <span class="header__logo-icon">V</span>

                <span class="header__logo-name">
                    valle<span class="header__logo-accent">play</span>
                </span>

            </a>

            <ul class="header__menu">

                <li class="header__item">
                    <a href="#inicio" class="header__link header__link--active">
                        Inicio
                    </a>
                </li>

                <li class="header__item">
                    <a href="#peliculas" class="header__link">
                        Películas
                    </a>
                </li>

                <li class="header__item">
                    <a href="#series" class="header__link">
                        Series
                    </a>
                </li>

                <li class="header__item">
                    <a href="#animadas" class="header__link">
                        Animadas
                    </a>
                </li>

            </ul>

            <form class="header__search" role="search">

                <input
                    type="search"
                    class="header__search-input"
                    placeholder="Buscar películas, series..."
                    aria-label="Buscar películas y series"
                >

                <button
                    type="submit"
                    class="header__search-button"
                    aria-label="Buscar"
                >

                    <svg
                        class="header__search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >

                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m16 16 4 4"></path>

                    </svg>

                </button>

            </form>

            <a href="#login" class="header__login">
                Ingresar
            </a>

        </nav>

    </header>

</body>

</html>
